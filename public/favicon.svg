<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="#FDFBF2" />
  
  <!-- Document Icon -->
  <!-- Left edge, bottom edge, right edge up to fold, and the fold -->
  <!-- Outline thickness ~36px -->
  <path d="M 160 160 L 280 160 L 360 240 L 360 360 L 160 360 Z" fill="none" stroke="#98BAA6" stroke-width="48" stroke-linejoin="round" />
  <!-- Fold line -->
  <path d="M 280 160 L 280 240 L 360 240" fill="none" stroke="#98BAA6" stroke-width="48" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Overlapping upward swoosh arrow -->
  <!-- Swoosh from bottom left (140, 360) curing up to middle right (380, 220) -->
  <path d="M 120 340 C 200 370, 280 340, 340 240" fill="none" stroke="#364149" stroke-width="56" stroke-linecap="round" />
  <!-- Arrowhead at the end of the swoosh -->
  <polygon points="310,210 380,200 365,270" fill="#364149" />
</svg>
